<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 樹狀階層編輯器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; background-color: #0f172a; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; overflow: hidden; }
        .node-card { transition: all 0.2s ease; border-left: 4px solid; }
        .node-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
        .port { width: 14px; height: 14px; border-radius: 50%; background: #475569; border: 2px solid #0f172a; cursor: crosshair; transition: all 0.2s; position: absolute; left: 50%; transform: translateX(-50%); z-index: 20; }
        .port:hover { background: #fbbf24; transform: translateX(-50%) scale(1.3); }
        .link-path { fill: none; stroke: #475569; stroke-width: 2.5; transition: all 0.2s; cursor: pointer; pointer-events: stroke; }
        .link-path:hover { stroke: #f87171; stroke-width: 4; }
        .canvas-bg { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 24px 24px; }
        textarea { background: transparent; border: none; resize: none; color: white; width: 100%; text-align: center; outline: none; font-size: 14px; font-weight: 500; height: 44px; padding: 4px; }
        textarea::placeholder { color: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const Icon = ({ name, size = 18 }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && lucide.icons[name]) {
                    iconRef.current.innerHTML = lucide.createIcons({
                        icons: { [name]: lucide.icons[name] },
                        attrs: { width: size, height: size }
                    });
                }
            }, [name, size]);
            return <span ref={iconRef} className="inline-flex items-center"></span>;
        };

        const App = () => {
            const [nodes, setNodes] = useState([
                { id: 'root', text: '主題', x: 400, y: 50, level: 0, color: '#f59e0b' },
                { id: 'n1', text: '章節', x: 200, y: 250, level: 1, color: '#3b82f6' },
                { id: 'n2', text: '章節', x: 600, y: 250, level: 1, color: '#10b981' }
            ]);
            const [links, setLinks] = useState([
                { id: 'l1', from: 'root', to: 'n1' },
                { id: 'l2', from: 'root', to: 'n2' }
            ]);
            
            const [dragging, setDragging] = useState(null);
            const [connecting, setConnecting] = useState(null);
            const fileInputRef = useRef(null);
            const containerRef = useRef(null);

            // 匯出 JSON
            const exportJSON = () => {
                const data = JSON.stringify({ nodes, links }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ai_架構圖.json';
                a.click();
            };

            // 匯入 JSON
            const importJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed && parsed.nodes && parsed.links) {
                            setNodes(parsed.nodes);
                            setLinks(parsed.links);
                        }
                    } catch (err) {
                        console.error("檔案讀取失敗");
                    }
                };
                reader.readAsText(file);
            };

            // 自動樹狀排版
            const autoLayout = () => {
                const nodeWidth = 200;
                const levelHeight = 160;
                const gap = 40;
                
                const newNodes = nodes.map(n => ({ ...n }));
                const adj = {};
                links.forEach(l => {
                    if (!adj[l.from]) adj[l.from] = [];
                    adj[l.from].push(l.to);
                });

                const rootIds = newNodes.filter(n => !links.some(l => l.to === n.id)).map(n => n.id);
                let currentX = 50;

                const layoutSubtree = (id, level) => {
                    const children = adj[id] || [];
                    const node = newNodes.find(n => n.id === id);
                    if (!node) return 0;
                    
                    node.level = level;
                    node.y = 50 + level * levelHeight;

                    if (children.length === 0) {
                        node.x = currentX;
                        currentX += nodeWidth + gap;
                        return node.x;
                    }

                    const firstChildX = layoutSubtree(children[0], level + 1);
                    for (let i = 1; i < children.length; i++) {
                        layoutSubtree(children[i], level + 1);
                    }
                    const lastChildNode = newNodes.find(n => n.id === children[children.length - 1]);
                    const lastChildX = lastChildNode ? lastChildNode.x : firstChildX;
                    
                    node.x = (firstChildX + lastChildX) / 2;
                    return node.x;
                };

                rootIds.forEach(rootId => layoutSubtree(rootId, 0));
                setNodes(newNodes);
            };

            const handleConnect = (nodeId, type) => {
                if (!connecting) {
                    if (type === 'bottom') setConnecting({ from: nodeId });
                } else {
                    if (type === 'top' && connecting.from !== nodeId) {
                        if (!links.some(l => l.from === connecting.from && l.to === nodeId)) {
                            setLinks([...links, { id: `l-${Date.now()}`, from: connecting.from, to: nodeId }]);
                        }
                    }
                    setConnecting(null);
                }
            };

            return (
                <div className="flex flex-col h-screen text-slate-100">
                    {/* 上方導覽列 */}
                    <nav className="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center z-50 shadow-xl">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-amber-500 rounded-lg text-slate-900 shadow-inner">
                                <Icon name="Network" size={22} />
                            </div>
                            <div>
                                <h1 className="font-bold text-lg leading-tight">AI 樹狀格編輯器</h1>
                                <p className="text-[10px] text-slate-400 font-medium">智慧防交錯版本</p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setNodes([...nodes, { id: `n-${Date.now()}`, text: '預設文字', x: 100, y: 100, level: 0, color: '#94a3b8' }])}
                                    className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold flex items-center gap-2 transition-all active:scale-95">
                                <Icon name="Plus" size={16} /> 新增主題
                            </button>
                            <button onClick={autoLayout} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg shadow-indigo-900/40 transition-all active:scale-95">
                                <Icon name="Trello" size={16} /> 自動樹狀對齊
                            </button>
                            <div className="w-px h-8 bg-slate-700 mx-2 self-center"></div>
                            <button onClick={exportJSON} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm transition-colors">
                                <Icon name="Download" size={16} /> 匯出
                            </button>
                            <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition-colors">
                                <Icon name="Upload" size={16} /> 匯入
                            </button>
                            <input type="file" ref={fileInputRef} onChange={importJSON} className="hidden" accept=".json" />
                        </div>
                    </nav>

                    {/* 畫布 */}
                    <main ref={containerRef} className="flex-grow relative bg-slate-950 canvas-bg overflow-hidden"
                          onMouseMove={(e) => {
                              if (!dragging) return;
                              const rect = containerRef.current.getBoundingClientRect();
                              setNodes(nds => nds.map(n => n.id === dragging ? { ...n, x: e.clientX - rect.left - 90, y: e.clientY - rect.top - 30 } : n));
                          }}
                          onMouseUp={() => setDragging(null)}>
                        
                        <svg className="absolute inset-0 w-full h-full pointer-events-auto">
                            <defs>
                                <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                                    <path d="M0 0 L10 3.5 L0 7 Z" fill="#475569" />
                                </marker>
                            </defs>
                            {links.map(l => {
                                const s = nodes.find(n => n.id === l.from);
                                const t = nodes.find(n => n.id === l.to);
                                if (!s || !t) return null;
                                const x1 = s.x + 90, y1 = s.y + 60;
                                const x2 = t.x + 90, y2 = t.y;
                                return (
                                    <path key={l.id} d={`M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`}
                                          className="link-path" markerEnd="url(#arrow)"
                                          onClick={() => setLinks(links.filter(link => link.id !== l.id))} />
                                );
                            })}
                        </svg>

                        {nodes.map(n => (
                            <div key={n.id} style={{ left: n.x, top: n.y, borderColor: n.color }}
                                 className="absolute w-[180px] h-[60px] bg-slate-900 rounded-xl shadow-2xl flex items-center justify-center node-card group z-10"
                                 onMouseDown={(e) => { if(!e.target.closest('.port')) setDragging(n.id); }}>
                                
                                {/* 頂部點 (父節點連至此處) */}
                                <div className="port -top-2" onClick={() => handleConnect(n.id, 'top')} />

                                <textarea 
                                    value={n.text === null ? "" : n.text} 
                                    placeholder="輸入內容..."
                                    onChange={(e) => setNodes(nodes.map(node => node.id === n.id ? {...node, text: e.target.value} : node))} 
                                />

                                {/* 底部點 (由此處連至子節點) */}
                                <div className="port -bottom-2" onClick={() => handleConnect(n.id, 'bottom')} />

                                {/* 刪除按鈕 */}
                                <button onClick={() => {
                                    setNodes(nodes.filter(node => node.id !== n.id));
                                    setLinks(links.filter(l => l.from !== n.id && l.to !== n.id));
                                }} className="absolute -top-3 -right-3 w-7 h-7 bg-red-500 rounded-full opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center text-white shadow-lg hover:bg-red-600 scale-90 group-hover:scale-100">
                                    <Icon name="X" size={14} />
                                </button>

                                {/* 顏色選擇 */}
                                <div className="absolute -left-10 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center">
                                    <input type="color" value={n.color} onChange={(e) => setNodes(nodes.map(node => node.id === n.id ? {...node, color: e.target.value} : node))}
                                           className="w-5 h-5 rounded-full overflow-hidden cursor-pointer bg-transparent border-none shadow-md" />
                                </div>
                            </div>
                        ))}

                        {connecting && (
                            <div className="fixed bottom-12 left-1/2 -translate-x-1/2 px-8 py-4 bg-amber-500 text-slate-900 rounded-2xl font-black shadow-2xl z-50 flex items-center gap-3 animate-pulse border-2 border-slate-900">
                                <Icon name="Zap" /> 請點選「子主題」上方的點完成連線
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 p-2 text-[11px] text-slate-500 flex justify-between px-10 border-t border-slate-800 font-medium">
                        <div className="flex gap-4 items-center">
                            <span className="flex items-center gap-1"><Icon name="MousePointer2" size={10} /> 拖曳節點</span>
                            <span className="flex items-center gap-1"><Icon name="Trash2" size={10} /> 點擊連線可刪除</span>
                        </div>
                        <div className="flex gap-4">
                            <span>主題數：{nodes.length}</span>
                            <span className="text-indigo-400">關聯數：{links.length}</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
