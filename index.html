<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＷＥＮ樹狀階層導覽編輯器 - 支援截圖貼上</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #050b18; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; overflow: hidden; }
        .canvas-bg { 
            background-color: #050b18;
            background-image: radial-gradient(#1e293b 1px, transparent 1px); 
            background-size: 30px 30px; 
        }
        .canvas-container {
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .node-card { 
            position: absolute; 
            min-height: 60px; 
            cursor: move; 
            transition: border-color 0.2s, box-shadow 0.2s, outline 0.2s, opacity 0.3s; 
            border-left: 4px solid; 
            z-index: 10;
        }
        .node-card.selected { outline: 2px solid #6366f1; outline-offset: 4px; z-index: 50; }
        
        .port { 
            width: 12px; height: 12px; border-radius: 50%; 
            background: #475569; border: 2px solid #0f172a; 
            cursor: crosshair; position: absolute; 
            top: 50%; transform: translateY(-50%); 
            z-index: 20; 
        }
        .port-left { left: -7px; }
        .port-right { right: -7px; }
        .port:hover { background: #fbbf24; transform: translateY(-50%) scale(1.3); }

        .toggle-btn {
            position: absolute;
            right: -24px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .toggle-btn:hover { background: #334155; color: white; }

        .link-path { fill: none; stroke: rgba(99, 102, 241, 0.4); stroke-width: 2.5; transition: stroke 0.2s, opacity 0.3s; pointer-events: none; }
        .text-input { 
            background: transparent; border: none; resize: none; 
            color: white; width: 100%; text-align: center; 
            outline: none; font-size: 14px; font-weight: 600; 
            min-height: 40px; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; 
        }
        .side-panel { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-primary { background-color: #4f46e5; color: white; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-secondary { background-color: #1e293b; color: #cbd5e1; }
        .btn-secondary:hover { background-color: #334155; color: white; }
        
        .tab-btn {
            position: relative;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
            transition: color 0.2s;
        }
        .tab-btn.active { color: #f59e0b; }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px; background: #f59e0b;
        }

        .hierarchy-item {
            padding: 0.5rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .hierarchy-item:hover { background: rgba(99, 102, 241, 0.15); color: white; }
        .hierarchy-item.active { background: rgba(99, 102, 241, 0.25); color: #818cf8; }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.875rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }

        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            cursor: zoom-out;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo, useCallback } = React;

        const SvgIcon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                plus: <path d="M12 4.5v15m7.5-7.5h-15" />,
                layout: <path d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />,
                download: <path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M7.5 12 12 16.5m0 0L16.5 12M12 16.5V3" />,
                upload: <path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />,
                x: <path d="M6 18 18 6M6 6l12 12" />,
                trash: <path d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />,
                note: <path d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />,
                image: <path d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6.75a1.5 1.5 0 0 0-1.5-1.5H3.75a1.5 1.5 0 0 0-1.5 1.5v12.75a1.5 1.5 0 0 0 1.5 1.5Zm10.5-1125h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />,
                chevronLeft: <path d="M15.75 19.5 8.25 12l7.5-7.5" />,
                chevronRight: <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />,
                chevronDown: <path d="m19.5 8.25-7.5 7.5-7.5-7.5" />,
                link: <path d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />,
                locate: (
                    <React.Fragment>
                        <path d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        <path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                    </React.Fragment>
                ),
                list: <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />,
                settings: <path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 0 1 0 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 0 1 0-.255c.007-.378.138.75-.43-.99l-1.004-.828a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281Z" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [nodes, setNodes] = useState([
                { id: 'root', text: '核心主題', x: 2000, y: 2000, color: '#f59e0b', note: '', image: null, collapsed: false }
            ]);
            const [links, setLinks] = useState([]);
            const [transform, setTransform] = useState({ x: 0, y: 0, scale: 0.8 });
            const [isSidePanelOpen, setIsSidePanelOpen] = useState(true);
            const [sideTab, setSideTab] = useState('edit');
            const [draggingId, setDraggingId] = useState(null);
            const [isCanvasDragging, setIsCanvasDragging] = useState(false);
            const [selectedId, setSelectedId] = useState('root');
            const [toast, setToast] = useState({ show: false, message: '' });
            const [zoomImage, setZoomImage] = useState(null); 
            
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);
            const imageInputRef = useRef(null);

            const showToast = (message) => {
                setToast({ show: true, message });
                setTimeout(() => setToast({ show: false, message: '' }), 3000);
            };

            const getNodeWidth = (text) => Math.min(Math.max(160, 140 + (text?.length || 0) * 10), 400);

            // Handle Paste functionality for screenshots
            const handlePaste = useCallback((e) => {
                if (!selectedId) return;
                
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        const blob = items[i].getAsFile();
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            setNodes(prevNodes => prevNodes.map(n => 
                                n.id === selectedId ? { ...n, image: event.target.result } : n
                            ));
                            showToast("已從剪貼簿貼上圖片");
                        };
                        reader.readAsDataURL(blob);
                        break;
                    }
                }
            }, [selectedId]);

            useEffect(() => {
                document.addEventListener('paste', handlePaste);
                return () => document.removeEventListener('paste', handlePaste);
            }, [handlePaste]);

            // 遞迴獲取所有被隱藏（收合）的子節點 ID
            const getHiddenNodeIds = useCallback(() => {
                const hidden = new Set();
                const adj = {};
                links.forEach(l => { if(!adj[l.from]) adj[l.from] = []; adj[l.from].push(l.to); });

                const traverse = (nodeId, isParentCollapsed) => {
                    const node = nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    
                    if (isParentCollapsed) {
                        hidden.add(nodeId);
                    }
                    
                    const children = adj[nodeId] || [];
                    children.forEach(childId => traverse(childId, isParentCollapsed || node.collapsed));
                };

                const roots = nodes.filter(n => !links.some(l => l.to === n.id));
                roots.forEach(root => traverse(root.id, root.collapsed));
                
                return hidden;
            }, [nodes, links]);

            const hiddenNodeIds = useMemo(() => getHiddenNodeIds(), [getHiddenNodeIds]);

            const focusAndZoom = useCallback((nodeId, customNodes = nodes) => {
                const node = customNodes.find(n => n.id === nodeId);
                if (!node || !containerRef.current) return;
                
                const rect = containerRef.current.getBoundingClientRect();
                const nodeW = getNodeWidth(node.text);
                const targetScale = 1.0;

                const targetX = rect.width / 2 - (node.x + nodeW / 2) * targetScale;
                const targetY = rect.height / 2 - (node.y + 30) * targetScale;

                setTransform({ x: targetX, y: targetY, scale: targetScale });
                setSelectedId(nodeId);
            }, [nodes]);

            const autoFocusAll = useCallback((targetNodes) => {
                if (!targetNodes || targetNodes.length === 0 || !containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                targetNodes.forEach(n => {
                    const w = getNodeWidth(n.text);
                    minX = Math.min(minX, n.x);
                    maxX = Math.max(maxX, n.x + w);
                    minY = Math.min(minY, n.y);
                    maxY = Math.max(maxY, n.y + 60);
                });
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const scale = Math.min(Math.max(0.4, Math.min((rect.width - 200) / (maxX - minX), (rect.height - 200) / (maxY - minY))), 1.2);
                setTransform({ x: rect.width / 2 - centerX * scale, y: rect.height / 2 - centerY * scale, scale: scale });
            }, []);

            useEffect(() => {
                autoFocusAll(nodes);
                const handleEsc = (e) => { if (e.key === 'Escape') setZoomImage(null); };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, []);

            const addNode = () => {
                const parent = nodes.find(n => n.id === selectedId) || nodes[0];
                const newId = `node-${Date.now()}`;
                const newNode = {
                    id: newId,
                    text: '新分支',
                    x: parent.x + 300, 
                    y: parent.y + (Math.random() * 100 - 50),
                    color: parent.color,
                    note: '',
                    image: null,
                    collapsed: false
                };
                const updatedNodes = [...nodes, newNode];
                setNodes(updatedNodes);
                setLinks([...links, { id: `link-${Date.now()}`, from: parent.id, to: newId }]);
                if(parent.collapsed) {
                    setNodes(nds => nds.map(n => n.id === parent.id ? {...n, collapsed: false} : n));
                }
                setTimeout(() => focusAndZoom(newId, updatedNodes), 50);
            };

            const toggleCollapse = (id) => {
                setNodes(nds => nds.map(n => n.id === id ? { ...n, collapsed: !n.collapsed } : n));
            };

            const handleWheel = (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    const zoomSpeed = 0.001;
                    const newScale = Math.min(Math.max(0.1, transform.scale - e.deltaY * zoomSpeed), 3);
                    const rect = containerRef.current.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const worldX = (mouseX - transform.x) / transform.scale;
                    const worldY = (mouseY - transform.y) / transform.scale;
                    setTransform({ x: mouseX - worldX * newScale, y: mouseY - worldY * newScale, scale: newScale });
                } else {
                    setTransform(prev => ({ ...prev, x: prev.x - e.deltaX, y: prev.y - e.deltaY }));
                }
            };

            const handleMouseMove = (e) => {
                if (isCanvasDragging) {
                    setTransform(prev => ({ ...prev, x: prev.x + e.movementX, y: prev.y + e.movementY }));
                } else if (draggingId) {
                    setNodes(nds => nds.map(n => n.id === draggingId 
                        ? { ...n, x: n.x + e.movementX / transform.scale, y: n.y + e.movementY / transform.scale } 
                        : n
                    ));
                }
            };

            const autoLayout = () => {
                const levelW = 500, gap = 50;
                let currentY = 1500;
                const newNodes = JSON.parse(JSON.stringify(nodes));
                const adj = {};
                links.forEach(l => { if(!adj[l.from]) adj[l.from] = []; adj[l.from].push(l.to); });
                const roots = nodes.filter(n => !links.some(l => l.to === n.id)).map(n => n.id);
                
                const traverse = (id, level) => {
                    const node = newNodes.find(n => n.id === id);
                    if(!node) return 0;
                    const children = adj[id] || [];
                    node.x = 1000 + level * levelW;
                    
                    if(children.length === 0) {
                        node.y = currentY;
                        currentY += 100 + gap; 
                        return node.y + 30;
                    }
                    
                    const childCenters = children.map(cId => traverse(cId, level + 1));
                    const center = (childCenters[0] + childCenters[childCenters.length-1]) / 2;
                    node.y = center - 30;
                    return center;
                };
                
                roots.forEach(r => traverse(r, 0));
                setNodes(newNodes);
                setTimeout(() => autoFocusAll(newNodes), 50);
            };

            const hierarchyData = useMemo(() => {
                const adj = {};
                links.forEach(l => { if(!adj[l.from]) adj[l.from] = []; adj[l.from].push(l.to); });
                const roots = nodes.filter(n => !links.some(l => l.to === n.id));
                const buildTree = (node, depth = 0) => {
                    const children = (adj[node.id] || []).map(childId => {
                        const childNode = nodes.find(n => n.id === childId);
                        return childNode ? buildTree(childNode, depth + 1) : null;
                    }).filter(Boolean);
                    return { ...node, children, depth };
                };
                return roots.map(r => buildTree(r));
            }, [nodes, links]);

            const selectedNode = useMemo(() => nodes.find(n => n.id === selectedId), [nodes, selectedId]);
            const outgoingLinks = useMemo(() => links.filter(l => l.from === selectedId), [links, selectedId]);

            const deleteLink = (linkId) => {
                setLinks(prev => prev.filter(l => l.id !== linkId));
                showToast('已刪除連接線');
            };

            const renderHierarchyList = (treeNodes) => {
                return treeNodes.map(node => {
                    if (hiddenNodeIds.has(node.id)) return null;

                    return (
                        <div key={node.id}>
                            <div 
                                className={`hierarchy-item text-sm ${selectedId === node.id ? 'active' : 'text-slate-400'}`}
                                style={{ paddingLeft: `${node.depth * 20 + 8}px` }}
                                onClick={() => {
                                    setSelectedId(node.id);
                                    setSideTab('edit');
                                    focusAndZoom(node.id);
                                }}
                            >
                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: node.color }}></span>
                                <span>
                                    {node.text} {node.collapsed ? ' (已收合)' : ''}
                                </span>
                            </div>
                            {!node.collapsed && node.children && renderHierarchyList(node.children)}
                        </div>
                    );
                });
            };

            return (
                <div className="flex h-screen text-slate-100 overflow-hidden relative select-none bg-[#050b18]">
                    <div className={`toast ${toast.show ? 'show' : ''}`}>{toast.message}</div>
                    
                    {zoomImage && (
                        <div className="lightbox-overlay" onClick={() => setZoomImage(null)}>
                            <button className="absolute top-6 right-6 p-3 bg-white/10 hover:bg-white/20 rounded-full text-white">
                                <SvgIcon name="x" className="w-8 h-8" />
                            </button>
                            <img src={zoomImage} className="max-w-[90vw] max-h-[90vh] object-contain rounded-lg shadow-2xl cursor-default" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}

                    <div className="flex flex-col flex-grow relative overflow-hidden">
                        <header className="bg-slate-900/95 backdrop-blur-xl border-b border-white/5 p-3 flex justify-between items-center z-[100] shadow-2xl">
                            <div className="flex items-center gap-4 px-2">
                                <div className="bg-amber-500 p-2 rounded-xl text-slate-900 shadow-lg shadow-amber-500/20"><SvgIcon name="layout" /></div>
                                <div>
                                    <h1 className="font-bold text-lg tracking-tight text-white uppercase italic">WEN Navigator</h1>
                                    <p className="text-[10px] text-slate-500 font-medium tracking-widest">SCREENSHOT CAPABLE</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <button onClick={addNode} className="btn-action btn-primary"><SvgIcon name="plus" className="w-4 h-4" /> 新增節點</button>
                                <button onClick={autoLayout} className="btn-action btn-secondary"><SvgIcon name="layout" className="w-4 h-4" /> 自動排版</button>
                                <div className="h-6 w-[1px] bg-white/10 mx-1"></div>
                                <button onClick={() => fileInputRef.current.click()} className="btn-action btn-secondary"><SvgIcon name="upload" className="w-4 h-4" /> 匯入</button>
                                <button onClick={() => {
                                    const blob = new Blob([JSON.stringify({ nodes, links })], { type: 'application/json' });
                                    const a = document.createElement('a');
                                    a.href = URL.createObjectURL(blob);
                                    a.download = `mindmap-${Date.now()}.json`;
                                    a.click();
                                }} className="btn-action btn-secondary bg-slate-800 text-emerald-400"><SvgIcon name="download" className="w-4 h-4" /> 匯出</button>
                                <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (!file) return;
                                    const reader = new FileReader();
                                    reader.onload = (ev) => {
                                        try {
                                            const d = JSON.parse(ev.target.result);
                                            if(d.nodes && d.links) { setNodes(d.nodes); setLinks(d.links); setTimeout(() => autoFocusAll(d.nodes), 100); }
                                        } catch(err) { console.error("Invalid File"); }
                                    };
                                    reader.readAsText(file);
                                }} />
                            </div>
                        </header>

                        <main 
                            ref={containerRef} 
                            className="flex-grow relative canvas-bg overflow-hidden cursor-grab active:cursor-grabbing"
                            onWheel={handleWheel}
                            onMouseDown={(e) => { if(e.button === 1 || e.target === containerRef.current) setIsCanvasDragging(true); }}
                            onMouseMove={handleMouseMove}
                            onMouseUp={() => { setIsCanvasDragging(false); setDraggingId(null); }}
                        >
                            <div 
                                className="absolute inset-0 pointer-events-none canvas-container"
                                style={{ transform: `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale})`, transformOrigin: '0 0' }}
                            >
                                <svg className="absolute inset-0 w-full h-full overflow-visible">
                                    <defs>
                                        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1" opacity="0.6" />
                                        </marker>
                                    </defs>
                                    <g>
                                        {links.map(l => {
                                            if (hiddenNodeIds.has(l.from) || hiddenNodeIds.has(l.to)) return null;
                                            
                                            const s = nodes.find(n => n.id === l.from), t = nodes.find(n => n.id === l.to);
                                            if (!s || !t) return null;
                                            
                                            const x1 = s.x + getNodeWidth(s.text), y1 = s.y + 30;
                                            const x2 = t.x, y2 = t.y + 30;
                                            const cp1x = x1 + (x2 - x1) / 2;
                                            const cp2x = x2 - (x2 - x1) / 2;
                                            return <path key={l.id} d={`M${x1},${y1} C${cp1x},${y1} ${cp2x},${y2} ${x2},${y2}`} className="link-path" markerEnd="url(#arrow)" />;
                                        })}
                                    </g>
                                </svg>

                                {nodes.map(n => {
                                    if (hiddenNodeIds.has(n.id)) return null;
                                    
                                    const hasChildren = links.some(l => l.from === n.id);

                                    return (
                                        <div key={n.id} style={{ left: n.x, top: n.y, width: getNodeWidth(n.text), borderColor: n.color }}
                                             className={`node-card bg-[#111827] rounded-xl shadow-2xl flex items-center justify-center p-2 pointer-events-auto border-white/5 ${selectedId === n.id ? 'selected shadow-indigo-500/40 scale-105' : ''}`}
                                             onMouseDown={(e) => { 
                                                e.stopPropagation(); 
                                                setSelectedId(n.id); 
                                                setDraggingId(n.id); 
                                                focusAndZoom(n.id);
                                             }}>
                                            
                                            <div className="port port-left" onMouseDown={(e) => { 
                                                e.stopPropagation(); 
                                                if(selectedId && selectedId !== n.id) {
                                                    const exists = links.find(l => (l.from === selectedId && l.to === n.id));
                                                    if(!exists) setLinks([...links, {id:`link-${Date.now()}`, from:selectedId, to:n.id}]); 
                                                }
                                            }} />
                                            
                                            <textarea 
                                                className="text-input no-scrollbar" 
                                                value={n.text} 
                                                onChange={(e) => setNodes(nodes.map(node => node.id === n.id ? {...node, text: e.target.value} : node))} 
                                            />
                                            
                                            <div className="port port-right" onMouseDown={(e) => { e.stopPropagation(); setSelectedId(n.id); focusAndZoom(n.id); }} />
                                            
                                            {hasChildren && (
                                                <div 
                                                    className="toggle-btn" 
                                                    onMouseDown={(e) => e.stopPropagation()}
                                                    onClick={(e) => { e.stopPropagation(); toggleCollapse(n.id); }}
                                                >
                                                    <SvgIcon name={n.collapsed ? "chevronRight" : "chevronDown"} className="w-3 h-3" />
                                                </div>
                                            )}

                                            <div className="absolute -top-3 -left-3 flex gap-1">
                                                {n.note && <div className="bg-amber-500 text-slate-900 p-1 rounded-lg shadow-lg scale-90 border border-amber-400/50"><SvgIcon name="note" className="w-3.5 h-3.5" /></div>}
                                                {n.image && <div className="bg-sky-500 text-slate-900 p-1 rounded-lg shadow-lg scale-90 border border-sky-400/50"><SvgIcon name="image" className="w-3.5 h-3.5" /></div>}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </main>
                    </div>

                    <button onClick={() => setIsSidePanelOpen(!isSidePanelOpen)} className="absolute top-1/2 -translate-y-1/2 z-[110] bg-slate-800 border border-white/10 p-1.5 rounded-l-xl hover:bg-slate-700 transition-colors" style={{ right: isSidePanelOpen ? '320px' : '0' }}>
                        <SvgIcon name={isSidePanelOpen ? "chevronRight" : "chevronLeft"} className="w-5 h-5 text-amber-500" />
                    </button>

                    <aside className={`bg-[#0f172a] border-l border-white/5 side-panel h-full z-[100] shadow-2xl flex flex-col ${isSidePanelOpen ? 'w-80' : 'w-0'}`}>
                        {isSidePanelOpen && (
                            <React.Fragment>
                                <div className="flex border-b border-white/5">
                                    <button onClick={() => setSideTab('edit')} className={`flex-1 tab-btn flex items-center justify-center gap-2 ${sideTab === 'edit' ? 'active' : ''}`}>
                                        <SvgIcon name="settings" className="w-4 h-4" /> 編輯屬性
                                    </button>
                                    <button onClick={() => setSideTab('hierarchy')} className={`flex-1 tab-btn flex items-center justify-center gap-2 ${sideTab === 'hierarchy' ? 'active' : ''}`}>
                                        <SvgIcon name="list" className="w-4 h-4" /> 階層導覽
                                    </button>
                                </div>

                                <div className="flex-grow overflow-y-auto no-scrollbar p-6">
                                    {sideTab === 'edit' ? (
                                        selectedNode ? (
                                            <div className="space-y-6">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h2 className="text-amber-500 font-bold flex items-center gap-2 uppercase tracking-tighter"><SvgIcon name="note" /> Node Editor</h2>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => focusAndZoom(selectedId)} className="bg-indigo-600/20 text-indigo-400 p-2 rounded-lg hover:bg-indigo-600/30"><SvgIcon name="locate" className="w-4 h-4" /></button>
                                                        <button onClick={() => {
                                                            if(selectedId === 'root') return;
                                                            setNodes(nodes.filter(n => n.id !== selectedId));
                                                            setLinks(links.filter(l => l.from !== selectedId && l.to !== selectedId));
                                                            setSelectedId(null);
                                                        }} className="bg-red-500/20 text-red-400 p-2 rounded-lg hover:bg-red-500/30"><SvgIcon name="trash" className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                                
                                                <div className="space-y-4">
                                                    <div className="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                                                        <span className="text-xs font-bold uppercase tracking-widest text-slate-400">階層狀態</span>
                                                        <button 
                                                            onClick={() => toggleCollapse(selectedId)}
                                                            className={`px-3 py-1 rounded-md text-[10px] font-bold uppercase transition-all ${selectedNode.collapsed ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50'}`}
                                                        >
                                                            {selectedNode.collapsed ? '已收合' : '已展開'}
                                                        </button>
                                                    </div>

                                                    <div>
                                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2 block">內容文字</label>
                                                        <textarea 
                                                            className="w-full bg-slate-800/50 border border-white/10 rounded-xl p-3 text-sm focus:border-amber-500/50 outline-none transition-all min-h-[80px]"
                                                            value={selectedNode.text}
                                                            onChange={(e) => setNodes(nodes.map(n => n.id === selectedId ? { ...n, text: e.target.value } : n))}
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2 block">詳細筆記</label>
                                                        <textarea 
                                                            placeholder="輸入更多補充資訊..."
                                                            className="w-full bg-slate-800/50 border border-white/10 rounded-xl p-3 text-sm focus:border-indigo-500/50 outline-none transition-all min-h-[120px]"
                                                            value={selectedNode.note}
                                                            onChange={(e) => setNodes(nodes.map(n => n.id === selectedId ? { ...n, note: e.target.value } : n))}
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2 block">主題色系</label>
                                                        <div className="flex gap-2 flex-wrap">
                                                            {['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#94a3b8'].map(c => (
                                                                <button key={c} onClick={() => setNodes(nodes.map(n => n.id === selectedId ? { ...n, color: c } : n))}
                                                                    className={`w-8 h-8 rounded-full border-2 transition-transform ${selectedNode.color === c ? 'scale-125 border-white' : 'border-transparent'}`}
                                                                    style={{ backgroundColor: c }} />
                                                            ))}
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2 block">參考圖片</label>
                                                        {selectedNode.image ? (
                                                            <div className="relative group rounded-xl overflow-hidden border border-white/10">
                                                                <img src={selectedNode.image} className="w-full h-40 object-cover cursor-zoom-in" onClick={() => setZoomImage(selectedNode.image)} />
                                                                <button onClick={() => setNodes(nodes.map(n => n.id === selectedId ? { ...n, image: null } : n))}
                                                                    className="absolute top-2 right-2 bg-red-500 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"><SvgIcon name="trash" className="w-4 h-4" /></button>
                                                            </div>
                                                        ) : (
                                                            <div className="border-2 border-dashed border-white/10 rounded-xl p-8 text-center hover:bg-white/5 transition-colors cursor-pointer"
                                                                 onClick={() => imageInputRef.current.click()}>
                                                                <SvgIcon name="image" className="w-8 h-8 mx-auto mb-2 text-slate-600" />
                                                                <p className="text-xs text-slate-500">點擊上傳或直接 Ctrl+V 貼上</p>
                                                                <input type="file" ref={imageInputRef} className="hidden" accept="image/*" onChange={(e) => {
                                                                    const file = e.target.files[0];
                                                                    if (!file) return;
                                                                    const reader = new FileReader();
                                                                    reader.onload = (ev) => setNodes(nodes.map(n => n.id === selectedId ? { ...n, image: ev.target.result } : n));
                                                                    reader.readAsDataURL(file);
                                                                }} />
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div>
                                                        <label className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2 block">子連線管理 ({outgoingLinks.length})</label>
                                                        <div className="space-y-1">
                                                            {outgoingLinks.map(l => {
                                                                const target = nodes.find(n => n.id === l.to);
                                                                return (
                                                                    <div key={l.id} className="link-item group">
                                                                        <span className="text-xs truncate max-w-[180px] text-slate-400">→ {target?.text || '未知節點'}</span>
                                                                        <button onClick={() => deleteLink(l.id)} className="text-slate-600 hover:text-red-400 p-1 opacity-0 group-hover:opacity-100 transition-all"><SvgIcon name="x" className="w-4 h-4" /></button>
                                                                    </div>
                                                                );
                                                            })}
                                                            {outgoingLinks.length === 0 && <p className="text-xs text-slate-600 italic py-2">目前沒有向外的連線</p>}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="h-full flex flex-col items-center justify-center text-slate-600 text-center p-4">
                                                <SvgIcon name="locate" className="w-12 h-12 mb-4 opacity-20" />
                                                <p className="text-sm">請在畫布上選擇節點<br/>以進行詳細編輯</p>
                                            </div>
                                        )
                                    ) : (
                                        <div className="space-y-4">
                                            <h2 className="text-amber-500 font-bold flex items-center gap-2 uppercase tracking-tighter mb-4"><SvgIcon name="list" /> Hierarchy</h2>
                                            <div className="bg-slate-800/30 rounded-xl p-2 border border-white/5">
                                                {renderHierarchyList(hierarchyData)}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 bg-slate-900 border-t border-white/5">
                                    <div className="flex items-center justify-between text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                                        <span>Nodes: {nodes.length}</span>
                                        <span>Links: {links.length}</span>
                                    </div>
                                </div>
                            </React.Fragment>
                        )}
                    </aside>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
