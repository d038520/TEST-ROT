<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ＷＥＮ樹狀編輯器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #0f172a; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; overflow: hidden; }
        .node-card { transition: transform 0.2s, box-shadow 0.2s; border-left: 4px solid; min-height: 60px; cursor: pointer; }
        .node-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
        .node-card.selected { outline: 2px solid #6366f1; outline-offset: 4px; z-index: 30; }
        .port { width: 12px; height: 12px; border-radius: 50%; background: #475569; border: 2px solid #0f172a; cursor: crosshair; position: absolute; left: 50%; transform: translateX(-50%); z-index: 20; }
        .port:hover { background: #fbbf24; transform: translateX(-50%) scale(1.3); }
        .link-path { fill: none; stroke: #475569; stroke-width: 2.5; transition: all 0.2s; cursor: pointer; pointer-events: stroke; }
        .link-path:hover { stroke: #f87171; stroke-width: 4; }
        .canvas-bg { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 24px 24px; }
        .text-input { background: transparent; border: none; resize: none; color: white; width: 100%; text-align: center; outline: none; font-size: 14px; font-weight: 600; min-height: 40px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .side-panel { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 穩定版 SVG 圖示組件，避免 undefined 錯誤
        const SvgIcon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                plus: <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />,
                layout: <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />,
                download: <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M7.5 12 12 16.5m0 0L16.5 12M12 16.5V3" />,
                upload: <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" d="M6 18 18 6M6 6l12 12" />,
                note: <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [nodes, setNodes] = useState([
                { id: 'root', text: '點擊此處開始', x: 400, y: 50, color: '#f59e0b', note: '這是初始格子的註解內容。' }
            ]);
            const [links, setLinks] = useState([]);
            const [dragging, setDragging] = useState(null);
            const [connecting, setConnecting] = useState(null);
            const [selectedId, setSelectedId] = useState(null);
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);

            const selectedNode = nodes.find(n => n.id === selectedId);

            const getNodeWidth = (text) => Math.min(Math.max(160, 140 + text.length * 12), 350);

            // 匯出
            const exportData = () => {
                const data = JSON.stringify({ nodes, links }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ＷＥＮ_${Date.now()}.json`;
                a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        setNodes(parsed.nodes || []);
                        setLinks(parsed.links || []);
                    } catch (err) { console.error(err); }
                };
                reader.readAsText(file);
            };

            // 新增格子：關鍵在於一定要初始化 note 屬性
            const handleAddNode = () => {
                const id = `node-${Date.now()}`;
                const newNode = {
                    id: id,
                    text: '新主題',
                    x: 100 + Math.random() * 200,
                    y: 100 + Math.random() * 200,
                    color: '#94a3b8',
                    note: '' // 這裡必須有，否則 undefined
                };
                setNodes([...nodes, newNode]);
                setSelectedId(id); // 自動選中新格子，方便直接打註解
            };

            const autoLayout = () => {
                const levelH = 150;
                const gap = 50;
                let currentX = 50;
                const newNodes = [...nodes];
                const adj = {};
                links.forEach(l => { if(!adj[l.from]) adj[l.from] = []; adj[l.from].push(l.to); });
                const roots = nodes.filter(n => !links.some(l => l.to === n.id)).map(n => n.id);

                const traverse = (id, level) => {
                    const node = newNodes.find(n => n.id === id);
                    if(!node) return;
                    const children = adj[id] || [];
                    node.y = 50 + level * levelH;
                    if(children.length === 0) {
                        node.x = currentX;
                        currentX += getNodeWidth(node.text) + gap;
                        return node.x + getNodeWidth(node.text)/2;
                    }
                    const childCenters = children.map(cId => traverse(cId, level + 1));
                    const center = (childCenters[0] + childCenters[childCenters.length-1]) / 2;
                    node.x = center - getNodeWidth(node.text)/2;
                    return center;
                };
                roots.forEach(r => traverse(r, 0));
                setNodes(newNodes);
            };

            const handleConnect = (nodeId, type) => {
                if (!connecting) {
                    if (type === 'bottom') setConnecting({ from: nodeId });
                } else {
                    if (type === 'top' && connecting.from !== nodeId) {
                        setLinks([...links, { id: `l-${Date.now()}`, from: connecting.from, to: nodeId }]);
                    }
                    setConnecting(null);
                }
            };

            return (
                <div className="flex h-screen text-slate-100 overflow-hidden relative">
                    <div className="flex flex-col flex-grow relative overflow-hidden">
                        {/* 頂部導覽列 */}
                        <header className="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center z-50">
                            <div className="flex items-center gap-3">
                                <div className="bg-amber-500 p-2 rounded-lg text-slate-900"><SvgIcon name="layout" /></div>
                                <div>
                                    <h1 className="font-bold">AI 樹狀詳細註解編輯器</h1>
                                    <p className="text-[10px] text-slate-400">點擊格子即可編輯/新增註解</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={handleAddNode} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold flex items-center gap-2">
                                    <SvgIcon name="plus" className="w-4 h-4" /> 新增
                                </button>
                                <button onClick={autoLayout} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg">
                                    <SvgIcon name="layout" className="w-4 h-4" /> 自動排版
                                </button>
                                <div className="w-px h-6 bg-slate-600 mx-2 self-center"></div>
                                <button onClick={exportData} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-bold flex items-center gap-2">
                                    <SvgIcon name="download" className="w-4 h-4" /> 匯出
                                </button>
                                <button onClick={() => fileInputRef.current.click()} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold">
                                    <SvgIcon name="upload" className="w-4 h-4" /> 匯入
                                </button>
                                <input type="file" ref={fileInputRef} className="hidden" onChange={importData} accept=".json" />
                            </div>
                        </header>

                        {/* 畫布 */}
                        <main ref={containerRef} className="flex-grow relative bg-slate-950 canvas-bg overflow-hidden"
                              onMouseDown={(e) => e.target === containerRef.current && setSelectedId(null)}
                              onMouseMove={(e) => {
                                  if (!dragging) return;
                                  const rect = containerRef.current.getBoundingClientRect();
                                  setNodes(nds => nds.map(n => n.id === dragging ? { ...n, x: e.clientX - rect.left - 80, y: e.clientY - rect.top - 30 } : n));
                              }}
                              onMouseUp={() => setDragging(null)}>
                            
                            <svg className="absolute inset-0 w-full h-full pointer-events-none">
                                {links.map(l => {
                                    const s = nodes.find(n => n.id === l.from);
                                    const t = nodes.find(n => n.id === l.to);
                                    if (!s || !t) return null;
                                    const sw = getNodeWidth(s.text), tw = getNodeWidth(t.text);
                                    const x1 = s.x + sw/2, y1 = s.y + 60, x2 = t.x + tw/2, y2 = t.y;
                                    return <path key={l.id} d={`M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`} className="link-path" onClick={() => setLinks(links.filter(li => li.id !== l.id))} />;
                                })}
                            </svg>

                            {nodes.map(n => {
                                const isSelected = selectedId === n.id;
                                const hasNote = n.note && n.note.length > 0;
                                return (
                                    <div key={n.id} style={{ left: n.x, top: n.y, width: getNodeWidth(n.text), borderColor: n.color }}
                                         className={`absolute bg-slate-900 rounded-xl shadow-xl flex items-center justify-center node-card p-2 group ${isSelected ? 'selected' : ''}`}
                                         onMouseDown={(e) => { e.stopPropagation(); setSelectedId(n.id); setDragging(n.id); }}>
                                        
                                        <div className="port -top-1.5" onMouseDown={(e) => { e.stopPropagation(); handleConnect(n.id, 'top'); }} />
                                        
                                        {hasNote && (
                                            <div className="absolute -top-3 -left-3 bg-amber-500 text-slate-900 p-1 rounded-md shadow-lg scale-90">
                                                <SvgIcon name="note" className="w-3 h-3" />
                                            </div>
                                        )}

                                        <textarea 
                                            className="text-input" value={n.text}
                                            onChange={(e) => setNodes(nodes.map(node => node.id === n.id ? {...node, text: e.target.value} : node))} 
                                        />

                                        <div className="port -bottom-1.5" onMouseDown={(e) => { e.stopPropagation(); handleConnect(n.id, 'bottom'); }} />
                                        
                                        <button onClick={(e) => { e.stopPropagation(); setNodes(nodes.filter(nd => nd.id !== n.id)); }} 
                                                className="absolute -top-3 -right-3 bg-red-500 rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <SvgIcon name="x" className="w-3 h-3" />
                                        </button>
                                    </div>
                                );
                            })}
                        </main>
                    </div>

                    {/* 右側註解面板 */}
                    <aside className={`w-80 bg-slate-900 border-l border-slate-700 side-panel absolute md:relative top-0 right-0 h-full z-[100] transform shadow-2xl ${selectedId ? 'translate-x-0' : 'translate-x-full'}`}>
                        {selectedNode && (
                            <div className="p-6 flex flex-col h-full">
                                <div className="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                                    <h2 className="text-amber-500 font-bold flex items-center gap-2"><SvgIcon name="note" /> 內容註解</h2>
                                    <button onClick={() => setSelectedId(null)} className="text-slate-500 hover:text-white"><SvgIcon name="x" /></button>
                                </div>
                                <div className="mb-6">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">標籤色</label>
                                    <input type="color" className="w-full h-10 bg-slate-800 border-none rounded cursor-pointer" value={selectedNode.color} 
                                           onChange={(e) => setNodes(nodes.map(nd => nd.id === selectedId ? {...nd, color: e.target.value} : nd))}/>
                                </div>
                                <div className="flex-grow flex flex-col">
                                    <label className="text-[10px] font-bold text-slate-500 uppercase block mb-2">詳細筆記 / 解釋</label>
                                    <textarea 
                                        className="flex-grow bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-300 outline-none focus:border-indigo-500 shadow-inner resize-none"
                                        placeholder="在這裡寫下這個節點的詳細內容..."
                                        value={selectedNode.note || ""}
                                        onChange={(e) => setNodes(nodes.map(nd => nd.id === selectedId ? {...nd, note: e.target.value} : nd))}
                                    />
                                </div>
                            </div>
                        )}
                    </aside>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
