<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海洋偵探：社群鑑定系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        :root { --app-width: 1920px; --app-height: 1080px; }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #020617; color: #f1f5f9; 
            margin: 0; display: flex; align-items: center; justify-content: center; 
            height: 100vh; width: 100vw; overflow: hidden;
        }
        
        #scaler {
            width: var(--app-width); height: var(--app-height);
            transform-origin: center center; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        #game-container {
            width: 100%; height: 100%; background: #020617; position: relative; overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        /* 放大鏡 UI */
        #custom-cursor {
            width: 180px; height: 180px; border: 6px solid #38bdf8; border-radius: 50%;
            position: absolute; pointer-events: none; z-index: 9999;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(56, 189, 248, 0.2);
            transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center;
        }

        .beach-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1920') center center;
            background-size: cover; height: 100%; position: relative;
        }

        /* 聚光燈效果修正 */
        .sample {
            position: absolute; 
            object-fit: contain;
            cursor: pointer;
            /* 預設隱藏，只有滑鼠照到時才顯示 */
            -webkit-mask-image: radial-gradient(circle at var(--mask-x, 50%) var(--mask-y, 50%), black 0%, transparent 0%);
            mask-image: radial-gradient(circle at var(--mask-x, 50%) var(--mask-y, 50%), black 0%, transparent 0%);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        /* 當滑鼠靠近時，擴大遮罩半徑 */
        .sample.active-light {
            -webkit-mask-image: radial-gradient(circle at var(--mask-x, 50%) var(--mask-y, 50%), black 100px, transparent 150px);
            mask-image: radial-gradient(circle at var(--mask-x, 50%) var(--mask-y, 50%), black 100px, transparent 150px);
        }

        .sample:hover { transform: scale(1.1); }

        .opt-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .opt-btn { 
            @apply p-10 bg-slate-800/90 hover:bg-sky-600 rounded-[2.5rem] transition-all border border-slate-700 hover:border-white text-4xl font-black flex items-center gap-8;
        }

        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="scaler">
        <div id="game-container">
            <div id="custom-cursor">🔍</div>

            <nav class="absolute top-0 w-full z-50 p-10 flex justify-between items-start pointer-events-none">
                <div class="fade-in-up">
                    <span class="bg-sky-500 text-black px-3 py-1 rounded font-black text-sm tracking-widest uppercase">Detective Hub</span>
                    <h1 class="text-4xl font-black mt-2 tracking-tighter italic">海洋廢棄物鑑定</h1>
                </div>
                <div class="bg-slate-900/90 px-8 py-4 rounded-3xl border border-slate-700 backdrop-blur-xl pointer-events-auto flex items-center gap-10 fade-in-up">
                    <div class="text-center">
                        <p class="text-slate-500 text-xs font-bold uppercase mb-1">已鑑定數量</p>
                        <p class="text-2xl font-black text-sky-400"><span id="col-count">0</span> / 6</p>
                    </div>
                    <div class="h-10 w-px bg-slate-700"></div>
                    <div class="text-center">
                        <p class="text-slate-500 text-xs font-bold uppercase mb-1">鑑定師等級</p>
                        <p id="rank-name" class="text-2xl font-black text-yellow-500 tracking-tight">海岸實習生</p>
                    </div>
                </div>
            </nav>

            <main id="view-beach" class="beach-bg">
                <img src="image/Gemini_Generated_Image_11s0eg11s0eg11s0.png" class="sample w-48 h-48" style="top: 55%; left: 10%" onclick="openLab(0)">
                <img src="image/Gemini_Generated_Image_28jq4q28jq4q28jq.png" class="sample w-48 h-48" style="top: 65%; left: 25%" onclick="openLab(1)">
                <img src="image/Gemini_Generated_Image_3lpc8u3lpc8u3lpc.png" class="sample w-48 h-48" style="top: 72%; left: 40%" onclick="openLab(2)">
                <img src="image/Gemini_Generated_Image_4d61qi4d61qi4d61.png" class="sample w-48 h-48" style="top: 60%; left: 55%" onclick="openLab(3)">
                <img src="image/Gemini_Generated_Image_rqk2h2rqk2h2rqk2.png" class="sample w-48 h-48" style="top: 78%; left: 70%" onclick="openLab(4)">
                <img src="image/Gemini_Generated_Image_vhpi3kvhpi3kvhpi.png" class="sample w-48 h-48" style="top: 68%; left: 82%" onclick="openLab(5)">
            </main>

            <div id="modal" class="absolute inset-0 z-[100] hidden bg-black/95 items-center justify-center p-20">
                <div class="bg-slate-900 border border-slate-800 w-full h-full rounded-[4rem] flex overflow-hidden shadow-2xl">
                    <div class="w-1/2 bg-black relative flex items-center justify-center border-r border-slate-800">
                        <div class="absolute top-12 left-12 z-20">
                            <p class="text-sky-500 text-xs font-black tracking-[0.3em] uppercase mb-2">Specimen Analysis</p>
                            <h3 class="text-4xl font-black italic">物件微觀觀察</h3>
                        </div>
                        <img id="lab-img" src="" class="w-full h-full object-contain p-20 relative z-10">
                    </div>
                    <div class="w-1/2 p-24 flex flex-col justify-center h-full bg-slate-900">
                        <div id="quiz-ui" class="h-full flex flex-col">
                            <div class="mb-12">
                                <p class="text-sky-400 font-bold text-sm tracking-widest uppercase mb-2">Evidence Collection</p>
                                <h2 id="q-title" class="text-5xl font-black mb-6">---</h2>
                                <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                                    <div id="q-bar" class="h-full bg-sky-500 transition-all duration-700"></div>
                                </div>
                            </div>
                            <div id="q-options" class="opt-grid custom-scroll overflow-y-auto flex-1 pr-4"></div>
                        </div>

                        <div id="result-ui" class="hidden h-full flex flex-col justify-center">
                            <div class="bg-sky-500/10 border border-sky-500/30 p-12 rounded-[3rem] mb-12">
                                <p class="text-sky-500 text-sm font-black tracking-widest mb-3 uppercase">Classification Result</p>
                                <h2 id="res-name" class="text-5xl font-black text-white italic mb-4">---</h2>
                                <p id="res-years" class="text-orange-500 font-black text-2xl tracking-wide"></p>
                            </div>
                            <div class="space-y-6 mb-12">
                                <h4 class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3">身世解析</h4>
                                <p id="res-timeline" class="text-slate-200 italic text-xl leading-relaxed"></p>
                            </div>
                            <div class="grid grid-cols-2 gap-6">
                                <button onclick="saveAndClose(false)" class="bg-slate-800 hover:bg-slate-700 py-6 rounded-3xl text-xl font-bold transition-all border border-slate-700">收錄並繼續鑑定</button>
                                <button onclick="saveAndClose(true)" class="bg-sky-600 hover:bg-sky-500 py-6 rounded-3xl text-xl font-black transition-all shadow-xl shadow-sky-900/40">收錄並查看報告</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <section id="report-page" class="hidden absolute inset-0 z-[200] bg-slate-950 overflow-y-auto p-24">
                <div class="max-w-7xl mx-auto">
                    <div class="text-center mb-24">
                        <h2 class="text-8xl font-black italic tracking-tighter text-white mb-6">MISSION ARCHIVE</h2>
                        <p class="text-slate-400 text-2xl">共同守護海岸線的偵探檔案</p>
                    </div>
                    <div id="report-grid" class="grid grid-cols-3 gap-10 mb-24"></div>
                    <div class="text-center">
                        <button onclick="location.reload()" class="bg-sky-600 px-16 py-8 rounded-[2.5rem] font-black text-xl hover:bg-sky-500 transition-all">重新巡視海灘</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // 修正資料組的圖片路徑，與 HTML 對應
        const materials = [
            { id: 0, name: '玻璃 (Glass)', years: '100萬年', tags: ['透光', '半透光', '極硬不動', '鋒利', '圓滑'], timeline: '這塊玻璃碎片若在古埃及金字塔建造時丟入海中，今天依然如新。', img: 'image/Gemini_Generated_Image_11s0eg11s0eg11s0.png' },
            { id: 1, name: '塑膠 (Plastic)', years: '450年', tags: ['半透光', '不透光', '會彎曲', '變形', '鋒利', '斷裂面', '印刷文字', '接縫', '純色', '彩色'], timeline: '麥哲倫環球航行時代丟棄的塑膠，現在才剛開始脆化成微塑膠。', img: 'image/Gemini_Generated_Image_28jq4q28jq4q28jq.png' },
            { id: 2, name: '金屬 (Metal)', years: '200年', tags: ['不透光', '會彎曲', '變形', '鋒利', '斷裂面', '生鏽', '金屬光澤', '塗漆'], timeline: '清朝末年的鐵罐丟入海中，到今天可能剛好鏽蝕殆盡。', img: 'image/Gemini_Generated_Image_3lpc8u3lpc8u3lpc.png' },
            { id: 3, name: '保麗龍 (Styrofoam)', years: '500年', tags: ['不透光', '碎裂', '粉碎', '有孔隙', '格狀結構', '粉末'], timeline: '保麗龍看似弱不禁風，卻能從美國獨立戰爭時期一直漂流到今天。', img: 'image/Gemini_Generated_Image_4d61qi4d61qi4d61.png' },
            { id: 4, name: '陶瓷 (Ceramic)', years: '永久', tags: ['不透光', '極硬不動', '鋒利', '斷裂面', '圓滑', '平順', '純色', '彩色'], timeline: '這是人類文明留給萬年後地球生物的永久性「人造化石」。', img: 'image/Gemini_Generated_Image_rqk2h2rqk2h2rqk2.png' },
            { id: 5, name: '橡膠 (Rubber)', years: '80年', tags: ['不透光', '有彈性', '變形', '有纖維感', '粗糙', '規則紋路'], timeline: '二戰時期掉進海裡的輪胎碎片，現在依然保留著強大的彈性。', img: 'image/Gemini_Generated_Image_vhpi3kvhpi3kvhpi.png' }
        ];

        const questions = [
            { title: "這東西透光嗎？", options: ["透光", "半透光", "不透光"] },
            { title: "物理壓力反應？", options: ["極硬不動", "會彎曲", "有彈性", "變形", "碎裂", "粉碎"] },
            { title: "邊緣質感如何？", options: ["鋒利", "斷裂面", "圓滑", "平順", "有纖維感", "有孔隙", "粗糙"] },
            { title: "表面人工痕跡？", options: ["生鏽", "金屬光澤", "塗漆", "格狀結構", "粉末", "印刷文字", "接縫", "純色", "彩色", "規則紋路"] }
        ];

        let state = { step: 0, selected: [], inventory: [], currentScale: 1, lastMatch: null };

        function handleResize() {
            const scaler = document.getElementById('scaler');
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            scaler.style.transform = `scale(${scale})`;
            state.currentScale = scale;
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('load', handleResize);

        // 修正聚光燈互動邏輯
        const cursor = document.getElementById('custom-cursor');
        const container = document.getElementById('game-container');
        
        document.addEventListener('mousemove', e => {
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / state.currentScale;
            const y = (e.clientY - rect.top) / state.currentScale;
            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';

            // 更新所有樣本的聚光燈座標
            document.querySelectorAll('.sample').forEach(s => {
                const sRect = s.getBoundingClientRect();
                const localX = ((e.clientX - sRect.left) / sRect.width) * 100;
                const localY = ((e.clientY - sRect.top) / sRect.height) * 100;
                s.style.setProperty('--mask-x', `${localX}%`);
                s.style.setProperty('--mask-y', `${localY}%`);

                // 計算滑鼠與圖片中心的距離
                const dist = Math.hypot(e.clientX - (sRect.left + sRect.width/2), e.clientY - (sRect.top + sRect.height/2));
                if(dist < 200) s.classList.add('active-light');
                else s.classList.remove('active-light');
            });
        });

        function openLab(id) {
            if(!materials[id]) return;
            state.step = 0; state.selected = [];
            cursor.style.opacity = '0';
            document.getElementById('modal').classList.replace('hidden', 'flex');
            document.getElementById('lab-img').src = materials[id].img;
            document.getElementById('quiz-ui').classList.remove('hidden');
            document.getElementById('result-ui').classList.add('hidden');
            renderQ();
        }

        function renderQ() {
            const q = questions[state.step];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-bar').style.width = `${(state.step + 1) * 25}%`;
            const box = document.getElementById('q-options');
            box.innerHTML = '';
            q.options.forEach(opt => {
                const b = document.createElement('button');
                b.className = "opt-btn";
                b.innerHTML = `<span class="w-3 h-3 rounded-full bg-sky-400"></span> ${opt}`;
                b.onclick = () => {
                    state.selected.push(opt);
                    if(state.step < 3) { state.step++; renderQ(); }
                    else { match(); }
                };
                box.appendChild(b);
            });
        }

        function match() {
            let best = materials[0], max = -1;
            materials.forEach(m => {
                let s = 0;
                state.selected.forEach(t => { if(m.tags.includes(t)) s++; });
                if(s > max) { max = s; best = m; }
            });
            state.lastMatch = best;
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('result-ui').classList.remove('hidden');
            document.getElementById('res-name').innerText = best.name;
            document.getElementById('res-years').innerText = `消失預估：約 ${best.years}`;
            document.getElementById('res-timeline').innerText = best.timeline;
        }

        function saveAndClose(goToReport) {
            if(!state.inventory.find(i => i.id === state.lastMatch.id)) {
                state.inventory.push(state.lastMatch);
            }
            document.getElementById('col-count').innerText = state.inventory.length;
            const rank = state.inventory.length < 3 ? "海岸實習生" : (state.inventory.length < 5 ? "淨灘分析師" : "海廢鑑定大師");
            document.getElementById('rank-name').innerText = rank;
            
            document.getElementById('modal').classList.replace('flex', 'hidden');
            cursor.style.opacity = '1';

            if(goToReport) showFinalReport();
        }

        function showFinalReport() {
            document.getElementById('report-page').classList.remove('hidden');
            const grid = document.getElementById('report-grid');
            grid.innerHTML = '';
            state.inventory.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-[3rem] p-10">
                        <img src="${item.img}" class="w-full h-48 object-contain mb-8">
                        <h4 class="text-3xl font-black mb-2">${item.name}</h4>
                        <p class="text-orange-500 font-black mb-4">${item.years}</p>
                        <p class="text-slate-400 text-sm italic">"${item.timeline}"</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
